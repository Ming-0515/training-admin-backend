spring:
  application:
    name: training-admin
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/training_admin?serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  servlet:
    multipart:
      # 单个文件最大大小
      max-file-size: 10MB
      # 上传请求最大总大小
      max-request-size: 20MB

  # 去掉spring横幅
  main:
    banner-mode: off

# mybatis配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名法
    map-underscore-to-camel-case: true

# 配置事务管理日志级别
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# 本地文件存储配置(头像等上传文件)
file:
  storage:
    # 存储根目录, 相对路径以应用工作目录为基准
    local-dir: ./uploads
    # 对外访问前缀: 前端统一使用 /api 前缀, 开发时由 Vite 代理到后端根路径;
    # 若浏览器直连后端端口, 改成 /uploads
    access-prefix: /api/uploads
    # 单个文件大小上限(字节), 10MB
    max-size: 10485760
